name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Unit Tests (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Conan and Ninja
        shell: cmd
        run: |
          python -m pip install --upgrade pip conan ninja
          conan profile detect --force

      - name: Configure and build (Release)
        shell: cmd
        run: build.bat release

      - name: Run asset-independent unit tests
        shell: powershell
        run: |
          .\build\ninja-msvc-x64-release\engine\test\test-engine.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\ninja-msvc-x64-release\kernel\test\test-kernel.exe "PedAction,[ipa],[mapobject],[map],[objectivedesc],[rnc],[squad],[gametime],[weaponholder],[ped][behaviour],[ped][police],[ped][agent][ai],[ped][pathfinding],[ped][perception]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
