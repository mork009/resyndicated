name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    name: Build & Package Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Conan and Ninja
        shell: cmd
        run: |
          python -m pip install --upgrade pip conan ninja
          conan profile detect --force

      - name: Build and package Release ZIP
        shell: cmd
        run: build.bat package

      - name: Run asset-independent unit tests
        shell: powershell
        run: |
          .\build\ninja-msvc-x64-release\engine\test\test-engine.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\ninja-msvc-x64-release\kernel\test\test-kernel.exe "PedAction,[ipa],[mapobject],[map],[objectivedesc],[rnc],[squad],[gametime],[weaponholder],[ped][behaviour],[ped][police],[ped][agent][ai],[ped][pathfinding],[ped][perception]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReSyndicated-x64-package
          path: |
            build/ninja-msvc-x64-release/PackageOutput/*.zip
            build/ninja-msvc-x64-release/PackageOutput/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem -Path "build/ninja-msvc-x64-release/PackageOutput" -Include *.zip, *.sha256 -File | Select-Object -ExpandProperty FullName
          gh release create $tag $files --title "ReSyndicated $tag" --generate-notes
