# ReSyndicated - Sample Squad Loadout & Mods Configuration
# Usage: resynd_game.exe -m 1 -l data/ref/sample_loadout.conf

# Global Cybernetic Mods (applied to all 4 agents unless overridden)
mods.legs=v1
mods.arms=v2
mods.chest=v3
mods.heart=v1
mods.eyes=v2
mods.brain=v3

# Global Weapons & Equipment (applied to all 4 agents unless overridden)
weapons=minigun, laser, persuadatron, shield, medikit

